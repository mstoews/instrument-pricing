services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
      POSTGRES_DB: pricing
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
